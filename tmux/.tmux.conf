# ============================
# Terminal
# ============================
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# ============================
# Shell
# ============================
set -g default-shell /usr/bin/zsh

# ============================
# Prefixo
# ============================
set -g prefix C-a
unbind C-b
bind-key C-a send-prefix

# ============================
# Divisão de painéis
# ============================
unbind %

bind | split-window -h -c "#{pane_current_path}"

unbind '"'
bind - split-window -v -c "#{pane_current_path}"

# ============================
# Recarregar configuração
# ============================
unbind r
bind r source-file ~/.tmux.conf \; display-message "tmux.conf recarregado"

# ============================
# Redimensionar painéis
# ============================
bind -r h resize-pane -L 5
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5

# Maximizar/restaurar painel
bind m resize-pane -Z

# ============================
# Mouse
# ============================
set -g mouse on

# ============================
# Clipboard - Wayland / Distrobox
# ============================
set -s set-clipboard on

# Copy mode - Vim
setw -g mode-keys vi

bind-key -T copy-mode-vi v send-keys -X begin-selection

# Copiar para o clipboard do host
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "distrobox-host-exec wl-copy"

# Copiar seleção feita com mouse
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "distrobox-host-exec wl-copy"

# Colar buffer interno do tmux
bind P paste-buffer

# ============================
# Plugins - TPM
# ============================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'jimeh/tmux-themepack'

# Persistência
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# ============================
# Tema
# ============================
set -g @themepack 'powerline/default/cyan'

# ============================
# Resurrect / Continuum
# ============================
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# ============================
# TPM - SEMPRE POR ÚLTIMO
# ============================
run '~/.tmux/plugins/tpm/tpm
